[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soliton-playground"
version = "0.1.0"
description = "Sandbox for topological structures in simulated media — play, not science"
requires-python = ">=3.10"
# scipy and pillow were already present as transitive gifts (via jax and
# matplotlib) and viz.py now imports both directly, so they are declared rather
# than relied on by luck. scikit-image is here for marching_cubes: viz.py's
# isosurface path is the only construction that renders a knot with its weave
# intact, so it is a real dependency of the figures, not an extra.
dependencies = ["numpy", "matplotlib", "scipy", "pillow", "scikit-image"]
# jax-solitons is installed from a sibling checkout (see README) until it ships
# to an index: pip install -e ../jax-solitons

[tool.setuptools.packages.find]
where = ["src"]

# The ten catalog entries are DATA the code reads at runtime
# (`ehn_lab.field_store.CATALOG`), not incidental files: a wheel without them has
# a store that reports an empty catalog and a B5 leg with nothing to conform
# against. The relaxed states themselves are NOT here -- they live in the
# content-addressed store at the repo root, deliberately outside the package,
# because they are hundreds of megabytes each.
[tool.setuptools.package-data]
"soliton_playground.ehn_lab" = ["particles/*/entry.json"]

# So `pytest tests/` works in a checkout that has NOT been pip-installed. Without
# this the suite only runs as `PYTHONPATH=src <some other venv>/bin/python -m
# pytest`, which is what the 2026-07-30 intake had to do on the receiving machine —
# it has no .venv here, so it borrowed jax-solitons' interpreter. The tests were
# green either way, but "23 tests pass" should not depend on knowing that trick.
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
