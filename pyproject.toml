[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soliton-playground"
version = "0.1.0"
description = "Sandbox for topological structures in simulated media — play, not science"
requires-python = ">=3.10"
dependencies = ["numpy", "matplotlib"]
# jax-solitons is installed from a sibling checkout (see README) until it ships
# to an index: pip install -e ../jax-solitons

[tool.setuptools.packages.find]
where = ["src"]

# So `pytest tests/` works in a checkout that has NOT been pip-installed. Without
# this the suite only runs as `PYTHONPATH=src <some other venv>/bin/python -m
# pytest`, which is what the 2026-07-30 intake had to do on the receiving machine —
# it has no .venv here, so it borrowed jax-solitons' interpreter. The tests were
# green either way, but "23 tests pass" should not depend on knowing that trick.
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
